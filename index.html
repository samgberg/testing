---
layout: default
---
<section class="intro">
  <span class="avatar big" aria-hidden="true">SG</span>
  <h1>{{ site.title }}</h1>
  <p>{{ site.tagline }}</p>
</section>

{% assign featured = site.posts.first %}
<section class="featured">
  {% include post-card.html post=featured big=true %}
</section>

<section>
  <h2 class="section-title">Latest</h2>
  <div class="grid">
    {% for p in site.posts offset: 1 limit: 6 %}{% include post-card.html post=p %}{% endfor %}
  </div>
  <p class="see-all"><a href="{{ '/blog/' | relative_url }}">See all {{ site.posts.size }} posts →</a></p>
</section>
