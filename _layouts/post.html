---
layout: default
---
<article class="post">
  <header>
    {% if page.category %}<a class="tag" href="{{ '/blog/' | relative_url }}#{{ page.category | slugify }}">{{ page.category }}</a>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %-d, %Y" }} · {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">← All writing</a></p>
</article>
