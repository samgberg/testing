<footer class="site-footer">
  <div class="wrap">
    <span>© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
    <span class="links">
      <a href="mailto:{{ site.email }}">Email</a>
      {% if site.linkedin != "" %}<a href="{{ site.linkedin }}">LinkedIn</a>{% endif %}
      <a href="https://github.com/{{ site.github }}">GitHub</a>
    </span>
  </div>
</footer>
